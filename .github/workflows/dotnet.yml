# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest] # , windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: ./global.json
    - name: Display dotnet version
      run: dotnet --version
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --check
    - name: Run tests
      run: dotnet test --no-restore --no-build --verbosity normal --report-html --report-gh --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
    - name: Install tools for test coverage reporting
      run: dotnet tool restore
    - name: Merge cobertura files
      run: dotnet coverage merge **/coverage.cobertura.xml --output-format cobertura --output test/TestResults/merged-coverage.cobertura.xml
    - name: Upload a build artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: my-application-build
        path: |
          test/**/*_net10.0_x64.log
          test/TestResults/merged-coverage.cobertura.xml
          test/**/coverage.cobertura.xml
          test/TestResults/*.html
